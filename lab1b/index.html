<!-- элементы -->
<!DOCTYPE html> <!-- тип документа -->
<html lang="ru"> <!-- дока на русском -->
  <head>
    <meta charset="UTF-8" /> <!-- Включает нормальное отображение русских букв -->
    <title>Генератор цветовой палитры</title> <!-- Задаёт название вкладки браузера -->
    <link rel="stylesheet" href="styles.css" /> <!-- Подключает файл со стилями. -->
  </head> <!-- настройки страницы, которые обычно не отображаются внутри неё -->

  <body>
    <main class="app"> <!-- название элемента, по которому CSS сможет его найти -->
      <header class="header">
        <div> <!-- обычная коробка для группировки элементов -->
          <p class="label">Лабораторная работа 1б</p>
          <h1>Генератор<br />цветовой палитры</h1> <!-- главный заголовок -->
        </div>

        <p class="hint"> <!-- текстовый абзац -->
          Нажмите «Копировать»,<br />чтобы скопировать HEX-код. <!-- <br /> перенос строки -->
        </p> <!-- текстовый абзац -->
      </header> <!-- верхняя часть страницы -->

      <section class="palette" id="palette"></section> <!-- class используется CSS для оформления; id используется JavaScript, чтобы найти конкретный элемент -->

      <button class="generate-button" id="generateButton" type="button">
        Сгенерировать
      </button>
    </main>

    <p class="message" id="message"></p> <!-- Сначала этот элемент пустой.После копирования JavaScript помещает в него текст -->

    <script src="script.js"></script> <!-- Загрузи и выполни код из файла script.js -->
  </body> <!-- содержимое страницы -->
</html>
