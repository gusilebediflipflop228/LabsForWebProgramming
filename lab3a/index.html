<!-- Сообщаем браузеру, что это документ HTML5. -->
<!DOCTYPE html>
<!-- Основной язык страницы — русский. -->
<html lang="ru">
<head>
    <!-- Кодировка UTF-8 нужна для правильного отображения русских букв. -->
    <meta charset="UTF-8">
    <!-- На телефонах ширина страницы соответствует ширине экрана, начальный масштаб — 100%. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Название, которое отображается на вкладке браузера. -->
    <title>Лабораторная работа 3а — смена темы</title>
    <!-- Подключаем CSS-файл: он отвечает за расположение элементов и их внешний вид. -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем JavaScript. defer откладывает его выполнение до разбора HTML, чтобы кнопка уже существовала. -->
    <script src="script.js" defer></script>
</head>
<!-- В body находится видимое содержимое страницы. JavaScript добавляет сюда класс dark для тёмной темы. -->
<body>
    <!-- Основной блок с картинкой, текстом и кнопкой. CSS размещает его по центру. -->
    <main>
        <!-- src — путь к картинке; alt — её описание для программ чтения с экрана и на случай ошибки загрузки. width и height задают исходный размер. -->
        <img src="smiley.png" alt="Жёлтый смайлик с цифрами 6 и 7" width="800" height="478">
        <!-- Главный заголовок страницы. -->
        <h1>Мир вокруг нас</h1>
        <!-- Абзац текста под картинкой. -->
        <p>Иногда стоит остановиться и насладиться красотой природы.</p>
        <!-- id позволяет найти кнопку в JavaScript. type="button" задаёт обычную кнопку. aria-pressed сообщает, включена ли тёмная тема, программам чтения с экрана. -->
        <button id="theme-button" type="button" aria-pressed="false">Включить тёмную тему</button>
    </main>
</body>
</html>
