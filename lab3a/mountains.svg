<!-- SVG — картинка из геометрических фигур. viewBox задаёт систему координат 480 на 280; начало находится слева сверху, X растёт вправо, Y — вниз. xmlns указывает формат SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280">
    <!-- Прямоугольник неба на всю картинку. fill — цвет заливки. -->
    <rect width="480" height="280" fill="#c9e4ed"/>
    <!-- Солнце: cx и cy — координаты центра, r — радиус. -->
    <circle cx="370" cy="65" r="30" fill="#f5c96b"/>
    <!-- Левая гора. path рисует контур по командам d: M — перейти к точке, следующие пары координат задают линии, Z — замкнуть контур. -->
    <path d="M0 195 120 45 245 195Z" fill="#76979b"/>
    <!-- Снежная вершина левой горы. Строчные команды задают относительные смещения; начальная m здесь отсчитывается от начала координат. -->
    <path d="m120 45-40 50 40-12 38 10Z" fill="#f4f7f5"/>
    <!-- Большая гора в центре. -->
    <path d="M150 195 300 65 450 195Z" fill="#4e767b"/>
    <!-- Снежная вершина центральной горы. -->
    <path d="m300 65-42 36 42-10 42 10Z" fill="#f4f7f5"/>
    <!-- Гора справа. V210 проводит вертикальную линию до координаты Y = 210. -->
    <path d="M350 195 440 115 480 150V210Z" fill="#678f8e"/>
    <!-- Озеро начинается на высоте y = 195. Поздние фигуры рисуются поверх предыдущих. -->
    <rect y="195" width="480" height="85" fill="#7ab4c5"/>
    <!-- Блики на воде. h — горизонтальная линия, m — переход к следующему участку; stroke задаёт цвет линии, stroke-width — толщину, stroke-linecap — форму концов. -->
    <path d="M40 218h95m70 18h120m-15-22h100M95 259h100m160-7h70" stroke="#c9e4ed" stroke-width="4" stroke-linecap="round"/>
</svg>
