<!doctype html>
<!-- Объявление выше включает современный стандарт HTML5. -->
<!-- Русский язык страницы помогает браузеру и экранным читалкам. -->
<html lang="ru">
  <head>
    <!-- UTF-8 обеспечивает корректное отображение русских букв. -->
    <meta charset="UTF-8" />
    <!-- Ширина страницы соответствует ширине экрана, в том числе на телефоне. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Название во вкладке браузера. -->
    <title>Счётчик кликов — Лабораторная работа 5</title>
  </head>
  <body>
    <!-- React заполнит этот контейнер содержимым компонента App. -->
    <div id="root"></div>
    <!-- Подключаем точку входа. type="module" позволяет использовать import.
         Vite обрабатывает JSX и импорты перед передачей кода браузеру. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
