<!-- Объявляем, что документ использует современный стандарт HTML5. -->
<!DOCTYPE html>
<!-- Указываем русский язык содержимого страницы. -->
<html lang="ru">
<head>
    <!-- Кодировка UTF-8 нужна для правильного отображения русских букв. -->
    <meta charset="UTF-8">
    <!-- На мобильных устройствах ширина страницы соответствует ширине экрана. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Название, которое отображается на вкладке браузера. -->
    <title>Лабораторная работа 6</title>
    <!-- Подключаем файл с оформлением круга и CSS-анимацией. -->
    <link rel="stylesheet" href="style.css">
    <!-- defer откладывает выполнение скрипта до завершения разбора HTML:
         к этому моменту кнопка уже будет доступна в JavaScript. -->
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Круг сделан из кнопки: её можно нажимать мышью и с клавиатуры.
         id связывает элемент с CSS-стилями и JavaScript-кодом.
         type="button" исключает отправку формы, если кнопка окажется внутри неё.
         aria-label задаёт название для программ чтения с экрана,
         поскольку видимого текста внутри круга нет. -->
    <button id="circle" type="button" aria-label="Изменить круг"></button>
</body>
</html>
