<!-- Объявляем документ HTML5. -->
<!DOCTYPE html>
<!-- Основной язык страницы — русский. -->
<html lang="ru">
<head>
    <!-- Кодировка UTF-8 нужна для корректного отображения русских букв. -->
    <meta charset="UTF-8">
    <!-- Подстраиваем ширину страницы под экран устройства. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Название вкладки браузера. -->
    <title>Лабораторная работа №7 — Печатная машинка</title>
    <!-- Подключаем файл с оформлением страницы. -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем JavaScript. defer откладывает выполнение до разбора HTML. -->
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Основное содержимое лабораторной работы. -->
    <main>
        <!-- Заголовок страницы и номер работы. -->
        <h1>Печатная машинка</h1>
        <p>Лабораторная работа №7</p>

        <!-- Подпись связана с полем ввода через for="input" и id="input". -->
        <label for="input">Введите текст:</label>
        <!-- Многострочное поле: rows задаёт высоту в строках, placeholder — подсказку. -->
        <textarea id="input" rows="6" placeholder="Напишите что-нибудь..."></textarea>

        <!-- Группа кнопок управления анимацией. -->
        <div class="buttons">
            <!-- Запускает печать. type="button" обозначает обычную кнопку. -->
            <button id="start" type="button">Старт</button>
            <!-- Останавливает печать; disabled делает кнопку неактивной до запуска. -->
            <button id="stop" type="button" disabled>Стоп</button>
        </div>
        <!-- Краткое пояснение поведения кнопок. -->
        <p class="hint">«Старт» печатает с начала. «Стоп» сохраняет напечатанный текст.</p>

        <!-- Подзаголовок области вывода. -->
        <h2 id="output-label">Результат:</h2>
        <!-- Сюда JavaScript выводит текст. role и aria-labelledby описывают область для программ чтения с экрана. -->
        <div id="output" role="region" aria-labelledby="output-label"></div>
    </main>
</body>
</html>
